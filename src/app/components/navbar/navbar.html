<nav class="navbar navbar-expand-lg navbar-dark barber-navbar">
  <a class="navbar-brand brand-link" routerLink="/home" aria-label="The Gentleman's Barber home">
    <img src="/images/logo.png" alt="The Gentleman's Barber Logo" class="brand-logo" />
    <span class="brand-copy">
      <span class="brand-name">The Gentleman's Barber</span>
      <span class="brand-tagline">Premium cuts & grooming</span>
    </span>
  </a>

  <button
    class="navbar-toggler"
    type="button"
    data-toggle="collapse"
    data-target="#navbarNavDropdown"
    aria-controls="navbarNavDropdown"
    aria-expanded="false"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarNavDropdown">
    <ul class="navbar-nav main-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-house" aria-hidden="true"></i>
          Inicio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/pricing" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <i class="fa-solid fa-scissors" aria-hidden="true"></i>
          Services and Pricing
        </a>
      </li>
    </ul>

    <ul class="navbar-nav account-nav ml-auto">
      @if (!auth.isUserLoggedIn()) {
        <li class="nav-item">
          <a class="nav-link login-link" routerLink="/login" routerLinkActive="active">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            Entrar
          </a>
        </li>
      } @else {
        <li class="nav-item">
          <a class="nav-link book-link" routerLink="/panel" routerLinkActive="active">
            <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
            Agendar
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle user-menu"
            href="#"
            id="navbarAccountMenu"
            data-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
          >
            <span class="user-avatar" aria-hidden="true">
              <i class="fa-solid fa-user"></i>
            </span>
            <span class="user-name">{{ auth.getUserLogged()?.name }}</span>
          </a>
          <div class="dropdown-menu dropdown-menu-right account-menu" aria-labelledby="navbarAccountMenu">
            <button class="dropdown-item logout-item" type="button" (click)="logout()">
              <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
              Sair
            </button>
          </div>
        </li>
      }
    </ul>
  </div>
</nav>
