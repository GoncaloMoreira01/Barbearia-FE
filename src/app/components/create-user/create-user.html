<div class="login-card">
  <h1>Create User</h1>
  <form #createUserForm="ngForm" (ngSubmit)="createUser(createUserForm)">
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" ngModel required />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" ngModel required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" ngModel required />
      <label></label>
    </div>
    <button type="submit" [disabled]="createUserForm.invalid">Create User</button>
    <div id="wrongCredentials" class="mt-2">
      At least one of the credentials is incorrect
    </div>
  </form>

  <span class="footer-text mt-2">© 2026 The Gentleman´s Barber</span>
</div>
