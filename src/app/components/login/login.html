<div class="login-card">
  <h1>Login</h1>
  <p class="subtitle">Access your appointment area</p>

  <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" ngModel required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" ngModel required />
      <label></label>
    </div>
    <button type="submit" [disabled]="loginForm.invalid">Login</button>
    <div id="wrongCredentials" class="mt-2">
      At least one of the credentials is incorrect.
    </div>
  </form>

  <p class="create-account-text">
    Don't have an account? <a routerLink="/create-user">Click here</a>
  </p>

  <span class="footer-text mt-2">2026 The Gentleman's Barber</span>
</div>
